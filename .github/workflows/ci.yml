name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q --tb=short

  purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: 零 meowagent 依赖检查
        run: |
          python -c "import meowcat; print('meowcat', meowcat.__version__)"
          python -c "import sys; sys.path.insert(0,'.'); \
            import ast, os; \
            code = [open(f'meowcat/{f}').read() for f in os.listdir('meowcat') if f.endswith('.py')] + \
                   [open(f'meowcat/defaults/{f}').read() for f in os.listdir('meowcat/defaults') if f.endswith('.py')]; \
            combined = '\n'.join(code); \
            assert 'import meowagent' not in combined, 'FATAL: meowcat imports meowagent!'; \
            print('Purity check PASSED')"
