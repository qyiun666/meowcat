[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MeowCat"
version = "1.3.5"
description = "An agent framework built on the biological blueprint of a cat"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
plus = [
    "httpx>=0.25",
    "playwright>=1.40",
    "chromadb>=0.4",
]
tui = [
    "textual>=0.52",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["meowcat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
