[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meowcat"
version = "1.0.18"
description = "An agent framework built on the biological blueprint of a cat"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["meowcat"]
