[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meowcat"
version = "2.5.0"
description = "An agent framework built on the biological blueprint of a cat"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
plus = [
    "chromadb>=0.4.0",
]
http = [
    "httpx>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["meowcat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = false
exclude = ["tests/"]
disable_error_code = ["attr-defined", "no-any-return"]

[[tool.mypy.overrides]]
module = ["pydantic", "anyio", "chromadb", "httpx"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".history/", "__pycache__/", "docs/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["PLC", "D", "F822", "N999"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["N806", "N814", "N817", "B017", "N801", "E741", "SIM105", "SIM103", "SIM117", "B023", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["meowcat"]
