[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MeowCat"
version = "1.3.7"
description = "An agent framework built on the biological blueprint of a cat"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
plus = [
    "httpx>=0.25",
    "playwright>=1.40",
    "chromadb>=0.4",
]
tui = [
    "textual>=0.52",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["meowcat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["tests/"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["pydantic", "anyio", "httpx", "playwright", "chromadb", "textual"]
ignore_missing_imports = true
